name: MLOps Pipeline CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  mlops-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Paso 1 - Extraccion de datos
        run: |
          python -m src.data.data_extraction

      - name: Paso 2 - Validacion de datos
        run: |
          python -m src.data.data_validation

      - name: Paso 3 - Limpieza de datos
        run: |
          python -m src.data.data_cleaning

      - name: Paso 4 - Entrenamiento de modelos con MLflow
        run: |
          python -m src.models.train

      - name: Paso 5 - Evaluacion de Quality Gate y Registro de Champion
        run: |
          python -m src.models.evaluate_and_register

      - name: Paso 6 - Pruebas unitarias y de API
        run: |
          python -m pytest tests/ -v
