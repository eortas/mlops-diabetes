version: '3.8'

services:
  # Servicio de la API FastAPI
  api:
    build: .
    container_name: mlops_api
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=./mlruns
    volumes:
      - ./mlruns:/app/mlruns
      - ./data:/app/data
    restart: unless-stopped

  # Servicio de Prometheus para recopilación de métricas
  prometheus:
    image: prom/prometheus:latest
    container_name: mlops_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    depends_on:
      - api

  # Servicio de Grafana para visualización y dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: mlops_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana_datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    restart: unless-stopped
    depends_on:
      - prometheus
